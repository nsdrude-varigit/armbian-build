# Variscite VAR-SOM-AM62P quad core

BOARD_NAME="VAR-SOM-AM62P"
BOARDFAMILY="k3-variscite"
BOARD_MAINTAINER="variscite"
BOOT_SOC="am62p"
BOOTCONFIG="am62px_var_som_a53_defconfig"
BOOTFS_TYPE="fat"
BOOT_FDT_FILE="k3-am62p5-var-som-symphony.dts"
TIBOOT3_BOOTCONFIG="am62px_var_som_r5_defconfig"
TIBOOT3_FILE="tiboot3-am62px-hs-fs-am62px-var-som.bin"
DEFAULT_CONSOLE="serial"
KERNEL_TARGET="vendor"
KERNEL_TEST_TARGET="vendor"
SERIALCON="ttyS0"
ATF_BOARD="lite"
OPTEE_ARGS="CFG_TEE_CORE_LOG_LEVEL=1"
OPTEE_PLATFORM="k3-am62px"
GPU_SUPPORT="yes"
SOC_ID="am62p"
DISPLAY_SUPPORT="yes"
CHROMIUM_SUPPORT="yes"
POWER_MANAGEMENT_FEATURES="yes"
PACKAGE_LIST_BOARD="libubootenv-tool"

# EXTRA_BOARD_PACKAGES will also be extended in sources/families/k3-variscite.conf
declare -g -a EXTRA_BOARD_PACKAGES

enable_extension "wifi-nxp"
