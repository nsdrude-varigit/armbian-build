# Variscite AM62 quad core

BOARD_NAME="VAR-SOM-AM62"
BOARDFAMILY="k3-variscite"
BOARD_MAINTAINER="variscite"
BOOT_SOC="am62"
BOOTCONFIG="am62x_var_som_a53_defconfig"
BOOTFS_TYPE="fat"
BOOT_FDT_FILE="k3-am625-var-som-symphony.dts"
TIBOOT3_BOOTCONFIG="am62x_var_som_r5_defconfig"
TIBOOT3_FILE="tiboot3-am62x-hs-fs-am62x-var-som.bin"
DEFAULT_CONSOLE="serial"
KERNEL_TARGET="vendor"
KERNEL_TEST_TARGET="vendor"
SERIALCON="ttyS0"
ATF_BOARD="lite"
OPTEE_ARGS="CFG_TEE_CORE_LOG_LEVEL=1"
OPTEE_PLATFORM="k3-am62x"
GPU_SUPPORT="yes"
SOC_ID="am62"
DISPLAY_SUPPORT="yes"
CHROMIUM_SUPPORT="yes"
POWER_MANAGEMENT_FEATURES="yes"
PACKAGE_LIST_BOARD="libubootenv-tool"

# EXTRA_BOARD_PACKAGES will also be extended in sources/families/k3-variscite.conf
declare -g -a EXTRA_BOARD_PACKAGES
EXTRA_BOARD_PACKAGES+=("brcm-patchram-plus" "linux-firmware-broadcom-license" "linux-firmware-cypress-license" "linux-firmware-bcm4339" "linux-firmware-bcm43430" "bcm43xx-utils")
