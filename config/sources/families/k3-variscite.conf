# EXTRA_BOARD_PACKAGES needs to be before we source k3_common.inc
EXTRA_BOARD_PACKAGES+=("var-suspend-utils-systemd" "var-wireless-utils" "udev-extraconf" "udev-aragoconf" "u-boot-splash")
source "${BASH_SOURCE%/*}/include/k3_common.inc"

# the following functions from k3_common are "needed" by our extension, so we will unset them from k3_common.inc
unset -f pre_prepare_partitions
unset -f format_partitions

declare -g LINUXFAMILY="k3-variscite" # Separate kernel package from the regular `k3` family
declare -g ATFSOURCE="https://github.com/TexasInstruments/arm-trusted-firmware"
declare -g KERNELSOURCE="https://github.com/varigit/ti-linux-kernel"
declare -g KERNEL_MAJOR_MINOR="6.12"
declare -g KERNELBRANCH="branch:ti-linux-6.12.y_11.02.08.02_var01"
declare -g BOOTSOURCE="https://github.com/varigit/ti-u-boot"
declare -g BOOTBRANCH="branch:ti-u-boot-2025.01_11.02.08.02_var01"
declare -g KERNEL_DESCRIPTION="Variscite Linux Kernel"
declare -g KERNELPATCHDIR="k3-variscite-linux"
declare -g ATFBRANCH="commit:e0c4d3903b382bf34f552af53e6d955fae5283ab"
declare -g OPTEE_BRANCH="commit:a9690ae39995af36a31b7a4f446f27ea0787e3a4"
declare -g TI_LINUX_FIRMWARE_BRANCH="tag:11.02.08"
EXTRAWIFI="no"


declare -g BOOTSCRIPT="boot-k3-variscite.cmd:uEnv.txt"

enable_extension "var-debpkgs"	# add Variscite package repository
enable_extension "k3-variscite-boot-layout" # keep kernel in root partition, boot partition only for bootloader
                                            # Also: Provide partition layout that is compatible with Yocto
                                            # This is MANDATORY if you use U-Boot with its default U-Boot offset
enable_extension "variscite-fs-tar" # export rootfs and bootfs as tar archive. Add option to include in final image
enable_extension "var-recovery-image" # modifications to the image for the SD Recovery Image

# we expect the DTB files not to be in the vendor folder
function pre_package_kernel_image__variscite_flatten_dtbs() {
	local dtb_root="${tmp_kernel_install_dirs[INSTALL_DTBS_PATH]}"

	if [[ -d "${dtb_root}/ti" ]]; then
		display_alert "Flattening TI DTBs" "${dtb_root}/ti -> ${dtb_root}" "info"

		find "${dtb_root}/ti" \
			-maxdepth 1 \
			-type f \
			-name '*.dtb*' \
			-exec mv -v -t "${dtb_root}" {} +
	fi
}

# also generate an initial U-Boot environment as part of the build process
function post_uboot_custom_postprocess__k3_variscite_initial_env() {
	display_alert "Generating U-Boot initial environment" "${BOARD}" "info"

	run_host_command_logged \
		"env" "-i" "${uboot_make_envs[@]}" \
		pipetty make u-boot-initial-env "$CTHREADS" "${cross_compile}"

	[[ -s u-boot-initial-env ]] ||
		exit_with_error "Failed to generate U-Boot initial environment"
}

function pre_package_uboot_image__k3_variscite_initial_env() {
	[[ -s u-boot-initial-env ]] ||
		exit_with_error "U-Boot initial environment not found"

	run_host_command_logged install -Dm0644 \
		u-boot-initial-env \
		"${destination}/etc/u-boot-initial-env"
}
